<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Box Animation</title>
    <style>
        .container {
            border: 1px solid black;
            height: 600px;
            width: 600px;
        }

        .box {
            position: absolute;
            width: 200px;
            height: 200px;
            background: lightblue;
            border-radius: 10%;
            animation: moveBox 4s ease-in-out infinite;
        }

        @keyframes moveBox {
            0% {
                margin: 0px;
                background-color: #ffffff; 
            }
            25% {
                margin-left: 400px;
                margin-top: 0px;
                background-color: #ffb3b3;
            }
            50% {
                margin-left: 400px;
                margin-top: 400px;
                background-color: #ff6666;
            }
            75% {
                margin-left: 0px;
                margin-top: 400px;
                background-color: #ff3333;
            }
            100% {
                margin-left: 0px;
                margin-top: 0px;
                background-color: #ff0000;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="box"></div>
    </div>

</body>

</html>
