<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
  .form-container {
    width: 700px;
    margin: 50px auto;
    padding: 30px;
    background-color: #fff5f7;
    text-align: center;
  }

  .form-container table {
    margin: 0 auto;
    text-align: left;
  }

  .form-container h1 {
    text-align: center;
  }

  .center-btn {
    text-align: center;
    margin-top: 20px;
  }
</style>

</head>
<body>
    <div class="form-container">
  <h1>Student Registration Form</h1>

  <form action="#" method="POST" enctype="multipart/form-data">
    <table>
      <!-- Roll no. -->
      <tbody><tr>
        <td class="label-cell"><label for="roll_no">Roll no. :</label></td>
        <td><input type="text" id="roll_no" name="roll_no"></td>
      </tr>

      <!-- Student name (Split row input layout) -->
      <tr>
        <td class="label-cell"><label>Student name :</label></td>
        <td>
          <div class="split-input">
            <input type="text" name="first_name" placeholder="First Name">
            <span>-</span>
            <input type="text" name="last_name" placeholder="Last Name">
          </div>
        </td>
      </tr>

      <!-- Father's name -->
      <tr>
        <td class="label-cell"><label for="fathers_name">Father's name :</label></td>
        <td><input type="text" id="fathers_name" name="fathers_name"></td>
      </tr>

      <!-- Date of birth (Dropdown layout combo) -->
      <tr>
        <td class="label-cell"><label>Date of birth :</label></td>
        <td>
          <div class="date-selects">
            <select name="dob_day">
              <option value="">Day</option>
              <!-- Add numerical loops dynamically later if needed -->
              <option value="01">01</option>
            </select>
            <span>-</span>
            <select name="dob_month">
              <option value="">Month</option>
              <option value="01">January</option>
            </select>
            <span>-</span>
            <select name="dob_year">
              <option value="">Year</option>
              <option value="2026">2026</option>
            </select>
            <span style="font-style: italic; margin-left: 10px;">(DD-MM-YYYY)</span>
          </div>
        </td>
      </tr>

      <!-- Mobile no. -->
      <tr>
        <td class="label-cell"><label for="mobile_no">Mobile no. :</label></td>
        <td>
          <div class="split-input mobile-input">
            <input type="text" name="country_code" value="+91">
            <span>-</span>
            <input type="text" id="mobile_no" name="mobile_no">
          </div>
        </td>
      </tr>

      <!-- Email id -->
      <tr>
        <td class="label-cell"><label for="email">Email id :</label></td>
        <td><input type="email" id="email" name="email"></td>
      </tr>

      <!-- Password -->
      <tr>
        <td class="label-cell"><label for="password">Password :</label></td>
        <td><input type="password" id="password" name="password"></td>
      </tr>

      <!-- Gender (Radio items from Image 2 & 3) -->
      <tr>
        <td class="label-cell"><label>Gender :</label></td>
        <td>
          <input type="radio" id="male" name="gender" value="male">
          <label for="male">Male</label>
          <input type="radio" id="female" name="gender" value="female">
          <label for="female">Female</label>
        </td>
      </tr>

      <!-- Department (Multi-checkbox structural grouping) -->
      <tr>
        <td class="label-cell"><label>Department :</label></td>
        <td>
          <input type="checkbox" id="cse" name="department" value="cse">
          <label for="cse">CSE</label>
          
          <input type="checkbox" id="it" name="department" value="it">
          <label for="it">IT</label>
          
          <input type="checkbox" id="ece" name="department" value="ece">
          <label for="ece">ECE</label>
          
          <input type="checkbox" id="civil" name="department" value="civil">
          <label for="civil">Civil</label>
          
          <input type="checkbox" id="mech" name="department" value="mech">
          <label for="mech">Mech</label>
        </td>
      </tr>

      <!-- Course Dropdown Selection -->
      <tr>
        <td class="label-cell"><label for="course">Course :</label></td>
        <td>
          <select id="course" name="course">
            <option value="">----------------- Select Current Course's -----------------</option>
            <option value="btech">B.Tech</option>
            <option value="mca">MCA</option>
            <option value="mba">MBA</option>
          </select>
        </td>
      </tr>

      <!-- Student photo -->
      <tr>
        <td class="label-cell"><label for="photo">Student photo :</label></td>
        <td><input type="file" id="photo" name="photo"></td>
      </tr>

      <!-- City -->
      <tr>
        <td class="label-cell"><label for="city">City :</label></td>
        <td><input type="text" id="city" name="city"></td>
      </tr>

      <!-- Address textbox area -->
      <tr>
        <td class="label-cell"><label for="address">Address :</label></td>
        <td><textarea id="address" name="address" rows="4"></textarea></td>
      </tr>
    </tbody></table>

    <!-- Bottom Submission Controls -->
    <div class="center-btn">
      <input type="submit" value="Register">
    </div>
  </form>
</div>
</body>
</html>
